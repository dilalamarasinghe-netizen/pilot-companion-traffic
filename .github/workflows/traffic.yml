name: Global Aircraft Traffic Collector

on:
  workflow_dispatch:

  repository_dispatch:
    types: [traffic-scan]
 
concurrency:
  group: global-aircraft-traffic
  cancel-in-progress: false

jobs:
  collect-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          chmod 600 firebase-service-account.json

      - name: Build collector
        run: npx tsc

      - name: Run traffic collector
        id: collector
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: node dist/index.js

      - name: Diagnose ADSB.lol connectivity after failure
        if: steps.collector.outcome == 'failure'
        run: |
          echo "The traffic collector failed. Checking ADSB.lol connectivity."

          for endpoint in \
            "https://api.adsb.lol/v2/point/0/0/20000" \
            "https://api.adsb.lol/v2/point/7.0/80.0/250"
          do
            echo ""
            echo "Testing: $endpoint"

            curl --silent --show-error \
              --output /dev/null \
              --write-out "HTTP status: %{http_code}\nConnection time: %{time_connect}s\nTotal time: %{time_total}s\n" \
              --connect-timeout 10 \
              --max-time 20 \
              "$endpoint" \
            || echo "Connectivity test failed with exit code $?"
          done

      - name: Remove Firebase credentials
        if: always()
        run: rm -f firebase-service-account.json

      - name: Fail workflow if collection failed
        if: steps.collector.outcome == 'failure'
        run: |
          echo "Traffic collection failed. Check the collector and connectivity diagnostic logs."
          exit 1
